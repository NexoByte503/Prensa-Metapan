    <text x="512" y="51" font-family="&#39;Montserrat&#39;, &#39;Arial&#39;, sans-serif" font-weight="800" font-size="44" letter-spacing="2.5" text-anchor="middle" fill="#ffffff" stroke="#083036" stroke-width="2.5">
