    <path d="M 48 38 H 126 C 158 38 176 58 176 89 C 176 120 158 140 126 140 H 84 V 197 H 48 Z M 84 68 V 110 H 122 C 136 110 142 102 142 89 C 142 76 136 68 122 68 Z" fill="#0a0a0a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
